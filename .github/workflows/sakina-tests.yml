name: Sakina tests

on:
  push:
    branches:
      - copilot/sakina-apk-build
      - feature/sakina-companion-memory
  pull_request:
    branches:
      - copilot/sakina-apk-build

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test
      - name: Check Worker module syntax
        run: node --input-type=module --check < worker/index.js
